<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hướng dẫn CS · Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f5; --surface: #ffffff; --ink: #1c2230; --muted: #5a6273; --line: #dfe2e6;
    --accent: #2f5d8a; --accent-soft: #e6eef6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #13171e; --surface: #1b2029; --ink: #e6e9ee; --muted: #9aa3b2; --line: #2c3340;
      --accent: #7fb0e0; --accent-soft: #1d2b3b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
    display: grid; grid-template-columns: 280px 1fr;
  }
  nav {
    background: var(--surface); border-right: 1px solid var(--line);
    padding: 24px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; padding-inline: 8px; }
  .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .brand b { font-size: 18px; }
  #groups { display: flex; flex-direction: column; gap: 22px; }
  .group { display: flex; flex-direction: column; gap: 2px; }
  .group h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; padding-inline: 8px; }
  .group a {
    display: flex; flex-direction: column; gap: 1px;
    padding: 7px 8px; border-radius: 6px; color: var(--ink); text-decoration: none;
  }
  .group a span { font-size: 12px; color: var(--muted); }
  .group a:hover { background: var(--bg); }
  .group a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .group a[aria-current="page"] span { color: var(--accent); font-weight: 400; }
  .open-tab { font-size: 13px; color: var(--muted); padding-inline: 8px; }
  .open-tab a { color: var(--accent); }
  main { min-width: 0; height: 100%; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  select { display: none; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 8px; }
    .group, .open-tab { display: none; }
    .brand b { font-size: 16px; }
    select {
      display: block; width: 100%; font: inherit; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
    }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="eyebrow">Steel · CS</div>
    <b>Hướng dẫn thao tác</b>
  </div>
  <select id="picker" aria-label="Chọn hướng dẫn"></select>
  <div id="groups"></div>
  <p class="open-tab"><a id="open-tab" href="#" target="_blank" rel="noopener">Mở trang này trong tab mới</a></p>
</nav>

<main>
  <iframe id="view" title="Nội dung hướng dẫn"></iframe>
</main>

<script>
  // Thêm guide mới: thêm một dòng vào đây.
  const GUIDES = [
    { group: "Gói & buổi tập", id: "chuyen-buoi", file: "huong-dan-chuyen-buoi.html", title: "Chuyển buổi", sub: "Từ gói cũ hết hạn sang gói mới" },
    { group: "Gói & buổi tập", id: "chuyen-nhuong", file: "huong-dan-thao-tac.html", title: "Chuyển nhượng", sub: "Chuyển buổi cho khách khác, sang tên gói" },
    { group: "Gói & buổi tập", id: "khach-moi", file: "ban-goi-khach-moi.html", title: "Bán gói khách mời", sub: "Thao tác bán gói" },
    { group: "Gói & buổi tập", id: "the-phu", file: "huong-dan-the-phu.html", title: "Thẻ phụ", sub: "Tạo, duyệt, check-in tài khoản phụ" },
    { group: "Lịch & booking", id: "lich-booking", file: "huong-dan-lich-booking.html", title: "Lịch Booking", sub: "Thao tác trên lịch" },
    { group: "Lịch & booking", id: "pilates-2-1", file: "huong-dan-pilates-2-1.html", title: "Pilates Training 2:1", sub: "Note cho team vận hành" },
    { group: "Lịch & booking", id: "group-class", file: "huong-dan-lich-group-class.html", title: "Lịch Group Class", sub: "Ghi danh, check-in, điểm danh lớp nhóm" },
    { group: "Giao dịch & thanh toán", id: "tao-giao-dich", file: "huong-dan-tao-giao-dich.html", title: "Tạo giao dịch & Upgrade", sub: "Wizard Tạo Gói, báo giá, upgrade" },
    { group: "Giao dịch & thanh toán", id: "thanh-toan", file: "huong-dan-thanh-toan.html", title: "Thanh toán", sub: "Full, đặt cọc, đợt 1, thu phần còn lại" },
  ];

  const view = document.getElementById("view");
  const picker = document.getElementById("picker");
  const groups = document.getElementById("groups");
  const openTab = document.getElementById("open-tab");
  const byId = Object.fromEntries(GUIDES.map(g => [g.id, g]));
  const byFile = Object.fromEntries(GUIDES.map(g => [g.file, g]));

  for (const name of [...new Set(GUIDES.map(g => g.group))]) {
    const box = document.createElement("div");
    box.className = "group";
    box.innerHTML = `<h2>${name}</h2>`;
    const optgroup = document.createElement("optgroup");
    optgroup.label = name;
    for (const g of GUIDES.filter(g => g.group === name)) {
      const a = document.createElement("a");
      a.href = "#" + g.id;
      a.dataset.id = g.id;
      a.innerHTML = `${g.title}<span>${g.sub}</span>`;
      box.append(a);
      optgroup.append(new Option(`${g.title} · ${g.sub}`, g.id));
    }
    groups.append(box);
    picker.append(optgroup);
  }

  function show(id) {
    const g = byId[id] || GUIDES[0];
    for (const a of groups.querySelectorAll("a")) {
      if (a.dataset.id === g.id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    }
    picker.value = g.id;
    openTab.href = g.file;
    document.title = `${g.title} · Hướng dẫn CS`;
    if (!view.src.endsWith("/" + g.file)) view.src = g.file;
  }

  // Link chéo bên trong một guide (vd. sang note vận hành) thì cập nhật menu theo.
  view.addEventListener("load", () => {
    let file;
    try { file = view.contentWindow.location.pathname.split("/").pop(); } catch { return; }
    const g = byFile[file];
    if (g && location.hash.slice(1) !== g.id) history.replaceState(null, "", "#" + g.id);
    if (g) show(g.id);
  });

  picker.addEventListener("change", () => { location.hash = picker.value; });
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
